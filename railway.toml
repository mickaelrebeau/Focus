[build]
builder = "RAILPACK"

[deploy]
startCommand = "node .output/server/index.mjs"
healthcheckPath = "/"
healthcheckTimeout = 300
restartPolicyType = "on_failure"

[[services]]
name = "web"
source = "."

[services.web]
startCommand = "node .output/server/index.mjs"
watchPatterns = [
  "app/**",
  "server/**",
  "shared/**",
  "public/**",
  "scripts/**",
  "nuxt.config.ts",
  "package.json",
  "pnpm-lock.yaml",
]

[[services]]
name = "worker"
source = "."

[services.worker]
startCommand = "npx tsx server/workers/deadlines.ts"
watchPatterns = [
  "server/workers/**",
  "server/utils/**",
  "package.json",
  "pnpm-lock.yaml",
]

[[services]]
name = "consequences"
source = "."

[services.consequences]
startCommand = "npx tsx server/workers/consequences.ts"
watchPatterns = [
  "server/workers/**",
  "server/utils/**",
  "server/consequences/**",
  "package.json",
  "pnpm-lock.yaml",
]
