[build]
builder = "RAILPACK"

[deploy]
startCommand = "node .output/server/index.mjs"
healthcheckPath = "/"
healthcheckTimeout = 300
restartPolicyType = "on_failure"

[[services]]
name = "web"
source = "."

[services.web]
startCommand = "node .output/server/index.mjs"

[[services]]
name = "worker"
source = "."

[services.worker]
startCommand = "npx tsx server/workers/deadlines.ts"
