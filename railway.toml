[build]
builder = "RAILPACK"

[deploy]
startCommand = "node .output/server/index.mjs"
healthcheckPath = "/"
healthcheckTimeout = 300
restartPolicyType = "on_failure"

# Ce fichier ne configure que le service web. Railway ne permet plus d'attacher un
# fichier de config-as-code à un nouveau service (remplacé par .railway/railway.ts) :
# les workers `worker` et `consequences` sont réglés dans leurs paramètres de service
# (voir « Déploiement Railway » dans le README).
