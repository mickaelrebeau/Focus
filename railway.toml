[build]
builder = "RAILPACK"

[deploy]
startCommand = "node .output/server/index.mjs"
healthcheckPath = "/"
healthcheckTimeout = 300
restartPolicyType = "on_failure"

# Ce fichier configure le service web. Les workers ont leur propre config-as-code,
# sélectionnée dans le réglage « Config file path » de chaque service Railway :
#   - worker       → /railway/worker.toml        (pnpm worker)
#   - consequences → /railway/consequences.toml  (pnpm worker:consequences)
