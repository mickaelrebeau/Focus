# Worker « deadlines » : expiration des échéances, génération, streaks, classement (tick toutes les 15 min).
# Config-as-code du service Railway « worker » (réglage « Config file path » : /railway/worker.toml).
# Remplace /railway.toml, qui décrit le service web (healthcheck HTTP, build Nuxt).

[build]
builder = "RAILPACK"
# Le worker s'exécute depuis les sources avec tsx : pas de build Nuxt
buildCommand = "echo 'Worker : build Nuxt inutile'"
watchPatterns = [
  "server/**",
  "shared/**",
  "package.json",
  "pnpm-lock.yaml",
  "railway/worker.toml",
]

[deploy]
startCommand = "pnpm worker"
# Pas de port HTTP : pas de healthcheck
restartPolicyType = "ALWAYS"
