# Worker « consequences » : exécution des conséquences mises en file (BullMQ).
# Config-as-code du service Railway « consequences » (réglage « Config file path » : /railway/consequences.toml).
# Remplace /railway.toml, qui décrit le service web (healthcheck HTTP, build Nuxt).

[build]
builder = "RAILPACK"
# Le worker s'exécute depuis les sources avec tsx : pas de build Nuxt
buildCommand = "echo 'Worker : build Nuxt inutile'"
watchPatterns = [
  "server/**",
  "shared/**",
  "package.json",
  "pnpm-lock.yaml",
  "railway/consequences.toml",
]

[deploy]
startCommand = "pnpm worker:consequences"
# Pas de port HTTP : pas de healthcheck
restartPolicyType = "ALWAYS"
