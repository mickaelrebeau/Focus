name: Bug
description: Signaler un bug reproductible
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Que se passe-t-il ?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Étapes de reproduction
      placeholder: |
        1. Aller sur…
        2. Cliquer sur…
        3. Observer…
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportement attendu
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environnement
      placeholder: "ex. macOS, Chrome 128, Node 22, pnpm 10"
    validations:
      required: false
  - type: textarea
    id: extras
    attributes:
      label: Infos complémentaires
      description: Captures, logs, liens éventuels (sans secrets)
